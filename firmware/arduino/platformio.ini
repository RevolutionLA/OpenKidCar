; OpenKidCar 干杯一号 —— Arduino Mega 2560 小脑工程
; 双环境：
;   native    : 编译为 PC 程序，用于协议测试与桌面模拟（无板子也能跑）
;   mega2560  : 编译为真实固件，烧录到 Arduino Mega 2560
;
; 编译 native：  pio run -e native
; 运行测试：     pio test -e native
; 编译固件：     pio run -e mega2560

[platformio]
default_envs = native

; ========== 桌面环境（PC 程序，协议测试用）==========
[env:native]
platform = native
build_flags = -Isrc -std=c++11
build_src_filter = +<*> -<hal/hal_mega.cpp>
test_framework = unity
test_build_src = yes       ; 让 pio test 也编译 src（含 main.cpp 测试钩子）

; ========== Arduino Mega 2560 真实固件 ==========
[env:mega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
build_flags = -Isrc
build_src_filter = +<*> -<hal/hal_sim.cpp>
lib_deps = arduino-libraries/Servo@^1.2.1   ; ESC + 转向舵机脉宽驱动（真实硬件）
